<div class="page-container">
  <app-page-header
    [title]="isEditMode() ? 'Edit Role' : 'Add Role'"
    [breadcrumbs]="[
      { label: 'Settings' },
      { label: 'Roles', link: '/admin/roles' },
      { label: isEditMode() ? 'Edit' : 'New' }
    ]"
  />

  <mat-card class="form-card mat-elevation-z0">
    <mat-card-content>
      <form [formGroup]="roleForm" (ngSubmit)="onSubmit()" class="form-layout">
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Role Name</mat-label>
          <input matInput formControlName="name" placeholder="E.g. Inventory Manager">
          @if (roleForm.controls.name.hasError('required')) {
            <mat-error>Name is required</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" rows="3" placeholder="Describe permissions and responsibilities..."></textarea>
        </mat-form-field>

        <div class="form-actions">
          <button mat-button type="button" (click)="router.navigate(['/admin/roles'])">Cancel</button>
          <button mat-flat-button color="primary" type="submit" [disabled]="roleForm.invalid || isSaving()">
            {{ isSaving() ? 'Saving...' : (isEditMode() ? 'Update Role' : 'Create Role') }}
          </button>
        </div>
        
      </form>
    </mat-card-content>
  </mat-card>
</div>
