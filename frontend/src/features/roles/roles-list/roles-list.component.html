<div class="page-container">
  <app-page-header
    title="Roles & Permissions"
    [breadcrumbs]="[{ label: 'Settings' }, { label: 'Roles' }]"
    actionLabel="New Role"
    actionIcon="add"
    (action)="router.navigate(['/admin/roles/new'])"
  />

  <div class="table-toolbar">
    <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput [formControl]="searchControl" placeholder="Search roles...">
    </mat-form-field>
  </div>

  <div class="table-container mat-elevation-z0">
    <table mat-table [dataSource]="roles()" class="full-width">
      
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let role">{{ role.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Role Name</th>
        <td mat-cell *matCellDef="let role" class="role-name">{{ role.name }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let role">{{ role.description || role.permissions || 'No description provided' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-column">Actions</th>
        <td mat-cell *matCellDef="let role" class="actions-column">
          <button mat-icon-button color="primary" [routerLink]="['/admin/roles', role.id, 'edit']" matTooltip="Edit Role" aria-label="Edit role">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteRole(role)" matTooltip="Delete Role" aria-label="Delete role">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;"></tr>
      
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-cell" [attr.colspan]="columns.length">
          @if (isLoading()) {
            <div class="table-empty-state">
              <mat-icon>sync</mat-icon>
              <span class="empty-title">Loading roles...</span>
            </div>
          } @else {
            <div class="table-empty-state">
              <mat-icon>security</mat-icon>
              <span class="empty-title">No roles found</span>
              <span class="empty-subtitle">Try adjusting your search criteria</span>
            </div>
          }
        </td>
      </tr>
    </table>

    <mat-paginator
      [length]="totalItems()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[10, 20, 50]"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>
  </div>
</div>
