<div class="page-container">
  <app-page-header
    [title]="'categories.title' | translate"
    [breadcrumbs]="[{ label: 'Inventory' }, { label: 'Categories' }]"
    [actionLabel]="'categories.newCategory' | translate"
    actionIcon="add"
    (action)="router.navigate(['/admin/categories/new'])"
  />

  <div class="table-toolbar">
    <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput [formControl]="searchControl" [placeholder]="'categories.searchPlaceholder' | translate">
    </mat-form-field>
  </div>

  <div class="table-container mat-elevation-z0">
    <table mat-table [dataSource]="categories()" class="full-width">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>{{ 'common.id' | translate }}</th>
        <td mat-cell *matCellDef="let category">{{ category.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>{{ 'categories.categoryName' | translate }}</th>
        <td mat-cell *matCellDef="let category">{{ category.name }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-column">{{ 'common.actions' | translate }}</th>
        <td mat-cell *matCellDef="let category" class="actions-column">
          <button mat-icon-button color="primary" [routerLink]="['/admin/categories', category.id, 'edit']"
                  [matTooltip]="'common.edit' | translate" [attr.aria-label]="'common.edit' | translate">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteCategory(category)"
                  [matTooltip]="'common.delete' | translate" [attr.aria-label]="'common.delete' | translate">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-cell" [attr.colspan]="columns.length">
          @if (isLoading()) {
            {{ 'categories.loading' | translate }}
          } @else {
            {{ 'categories.emptyTitle' | translate }}
          }
        </td>
      </tr>
    </table>

    <mat-paginator
      [length]="totalItems()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[10, 20, 50]"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>
  </div>
</div>
