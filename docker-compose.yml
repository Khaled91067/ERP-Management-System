services:
  erp-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: erp-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    networks:
      - erp-network
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}\" -Q \"SELECT 1\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  erp-redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - erp-network
    volumes:
      - redis_data:/data

  erp-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: erp-backend:latest
    container_name: erp-backend-container
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=erp-sqlserver,1433;Database=ERPDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;
      - ConnectionStrings__RedisConnection=erp-redis:6379
    depends_on:
      erp-sqlserver:
        condition: service_healthy
      erp-redis:
        condition: service_started
    networks:
      - erp-network

  erp-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: erp-frontend:latest
    container_name: erp-frontend-container
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - erp-backend
    networks:
      - erp-network

networks:
  erp-network:
    name: erp-network

volumes:
  mssql_data:
  redis_data:
